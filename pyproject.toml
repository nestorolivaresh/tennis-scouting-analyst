[project]
name = "tennis-scouting-analyst"
version = "0.1.0"
description = "AI scouting analyst over public ATP match data, where every statistic comes from tested code."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pandas>=2.2",  # only ingest/audit.py; kept out of the deployed bundle (D-025)
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ingest", "api", "evals"]
addopts = "-rs"  # list skipped tests and why, e.g. database tests without DATABASE_URL
